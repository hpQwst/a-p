AWSTemplateFormatVersion: "2010-09-09"
Description: >
  QWST Auto PPT - infraestrutura de build. O codigo chega como um zip no S3, entao
  o CodeBuild nao precisa de conexao com nenhum servico de repositorio. O
  repositorio de codigo (Azure DevOps) segue sendo a fonte da verdade.

Parameters:
  AppName:
    Type: String
    Default: squad4e5-auto-ppt
  SourceObjectKey:
    Type: String
    Default: source/source.zip
    Description: Objeto no bucket de build que carrega o codigo a ser construido.

Resources:
  # Guarda apenas o zip do codigo enviado para build. Nada aqui e precioso: o
  # conteudo e descartavel e expira sozinho.
  BuildBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-build-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expira-fontes-antigas
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Name
          Value: !Ref AppName

  ImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref AppName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Mantem as 10 imagens mais recentes",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Ref AppName

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-build"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AppName}*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:aws:s3:::${AppName}-build-${AWS::AccountId}/*"
              # GetAuthorizationToken nao aceita recurso especifico.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: !GetAtt ImageRepository.Arn

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AppName}-build"
      ServiceRole: !GetAtt BuildRole.Arn
      Source:
        Type: S3
        Location: !Sub "${BuildBucket}/${SourceObjectKey}"
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        # Necessario para rodar docker build dentro do CodeBuild.
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: IMAGE_REPO_NAME
            Value: !Ref AppName
      TimeoutInMinutes: 30
      Tags:
        - Key: Name
          Value: !Ref AppName

Outputs:
  BuildBucketName:
    Value: !Ref BuildBucket
  BuildProjectName:
    Value: !Ref BuildProject
  RepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}"

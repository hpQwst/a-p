<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro - QWST Auto PPT</title>
    <script>
      (function () {
        var theme = localStorage.getItem("qwst-theme");
        if (!theme) {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v={{ asset_version('style.css') }}">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">QWST Auto PPT</p>
          <h1>Não consegui concluir a análise</h1>
        </div>
      </header>
      <section class="error-panel">
        <span class="error-icon">!</span>
        <div class="notice warn">{{ message }}</div>
        <p class="muted">Confira se a apresentação é um .pptx válido e se você enviou as planilhas (.xlsx) do relatório. Ajuste os arquivos e tente de novo.</p>
        <a class="button" href="/">Voltar para a central</a>
      </section>
    </main>
  </body>
</html>

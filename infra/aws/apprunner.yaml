AWSTemplateFormatVersion: "2010-09-09"
Description: >
  QWST Auto PPT - App Runner + S3. Um container unico serve a aplicacao e guarda
  projetos, mapeamentos, usuarios e memoria isolada por squad no S3.

Parameters:
  AppName:
    Type: String
    Default: squad4e5-auto-ppt
    Description: Nome base de todos os recursos. Precisa comecar com squad4/squad5.
  ImageUri:
    Type: String
    Description: Imagem no ECR ja publicada (ex. 1234.dkr.ecr.us-east-1.amazonaws.com/squad4e5-auto-ppt:abc123).
  OpenAISecretArn:
    Type: String
    Description: ARN do secret com a chave da OpenAI.
  BucketName:
    Type: String
    Description: Bucket S3 que guarda o estado compartilhado.
  StoragePrefix:
    Type: String
    Default: auto-ppt
    Description: Prefixo dentro do bucket.
  SessionSecretArn:
    Type: String
    Description: ARN do secret que assina o cookie de sessao.
  EntraTenantId:
    Type: String
    Default: ""
    Description: Tenant do login Microsoft obrigatorio em producao.
  EntraClientId:
    Type: String
    Default: ""
  EntraRedirectUri:
    Type: String
    Default: ""
  EntraClientSecretArn:
    Type: String
    Default: ""
    Description: ARN do secret com o client secret do Entra.
  BootstrapAdminEmails:
    Type: String
    Default: hugo.rocha@qwst.co
    Description: E-mails separados por virgula que nascem como admin.
  AlarmEmail:
    Type: String
    Default: hugo.rocha@qwst.co
    Description: E-mail que recebe alertas de respostas 5xx do App Runner.

Conditions:
  HasEntra: !Not [!Equals [!Ref EntraClientSecretArn, ""]]

Resources:
  # Estado compartilhado. Versionamento ligado de proposito: se um mapeamento for
  # sobrescrito por engano, da para recuperar a versao anterior.
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: trim-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: expire-generated-runs
            Status: Enabled
            TagFilters:
              - Key: retention
                Value: run
            ExpirationInDays: 180
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Ref AppName

  # Permite ao App Runner puxar a imagem do ECR.
  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-ecr-access"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # Permissoes do container em execucao: so o bucket do app e os secrets usados.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-instance"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: state-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:PutObjectTagging
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${BucketName}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${BucketName}"
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If
                  - HasEntra
                  - [!Ref OpenAISecretArn, !Ref SessionSecretArn, !Ref EntraClientSecretArn]
                  - [!Ref OpenAISecretArn, !Ref SessionSecretArn]

  # Uma instancia no maximo. O project_store grava JSON no S3 e duas instancias
  # gravando ao mesmo tempo poderiam perder uma atualizacao. Com o uso atual
  # (poucas vezes por mes) uma instancia sobra.
  ScalingConfig:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub "${AppName}-single"
      MaxConcurrency: 20
      MinSize: 1
      MaxSize: 1

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref AppName
      AutoScalingConfigurationArn: !Ref ScalingConfig
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8501"
            RuntimeEnvironmentVariables:
              - Name: AUTO_PPT_STORAGE_BACKEND
                Value: s3
              - Name: AUTO_PPT_S3_BUCKET
                Value: !Ref BucketName
              - Name: AUTO_PPT_S3_PREFIX
                Value: !Ref StoragePrefix
              - Name: AUTO_PPT_RUNTIME_ROOT
                Value: /tmp/auto-ppt-jobs
              - Name: OPENAI_MODEL
                Value: gpt-5.6-terra
              - Name: OPENAI_MODEL_SOURCE_MATCH
                Value: gpt-5.6-luna
              - Name: OPENAI_MODEL_SLIDE_UNDERSTANDING
                Value: gpt-5.6-terra
              - Name: OPENAI_MODEL_SLIDE_MATRIX_BUILDER
                Value: gpt-5.6-terra
              - Name: OPENAI_MODEL_TRANSFORM_DIAGNOSTICS
                Value: gpt-5.6-luna
              - Name: OPENAI_REASONING_EFFORT
                Value: low
              - Name: OPENAI_REASONING_EFFORT_SOURCE_MATCH
                Value: none
              - Name: OPENAI_REASONING_EFFORT_SLIDE_UNDERSTANDING
                Value: low
              - Name: OPENAI_REASONING_EFFORT_SLIDE_MATRIX_BUILDER
                Value: low
              - Name: OPENAI_REASONING_EFFORT_TRANSFORM_DIAGNOSTICS
                Value: none
              - Name: AUTO_PPT_AI_AUTO_SOURCE_REVIEW
                Value: "0"
              - Name: AUTO_PPT_AUTO_SLIDE_AI
                Value: "0"
              - Name: ENTRA_TENANT_ID
                Value: !Ref EntraTenantId
              - Name: ENTRA_CLIENT_ID
                Value: !Ref EntraClientId
              - Name: ENTRA_REDIRECT_URI
                Value: !Ref EntraRedirectUri
              - Name: AUTO_PPT_TEAM_PASSWORD_ENABLED
                Value: "0"
              - Name: AUTO_PPT_BOOTSTRAP_ADMINS
                Value: !Ref BootstrapAdminEmails
            RuntimeEnvironmentSecrets: !If
              - HasEntra
              - - Name: OPENAI_API_KEY
                  Value: !Ref OpenAISecretArn
                - Name: AUTO_PPT_SESSION_SECRET
                  Value: !Ref SessionSecretArn
                - Name: ENTRA_CLIENT_SECRET
                  Value: !Ref EntraClientSecretArn
              - - Name: OPENAI_API_KEY
                  Value: !Ref OpenAISecretArn
                - Name: AUTO_PPT_SESSION_SECRET
                  Value: !Ref SessionSecretArn
      InstanceConfiguration:
        Cpu: "1024"
        Memory: "2048"
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health/live
        Interval: 20
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      Tags:
        - Key: Name
          Value: !Ref AppName

  ErrorAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AppName}-errors"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail
      Tags:
        - Key: Name
          Value: !Ref AppName

  FiveXxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AppName}-5xx"
      AlarmDescription: Alerta quando o App Runner devolve ao menos uma resposta 5xx em cinco minutos.
      Namespace: AWS/AppRunner
      MetricName: 5xxStatusResponses
      Dimensions:
        - Name: ServiceName
          Value: !Ref AppName
        - Name: ServiceID
          Value: !GetAtt Service.ServiceId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ErrorAlarmTopic
      Tags:
        - Key: Name
          Value: !Ref AppName

Outputs:
  ServiceUrl:
    Description: Endereco para a equipe abrir no navegador.
    Value: !Sub "https://${Service.ServiceUrl}"
  ServiceArn:
    Description: Usado para publicar novas versoes (start-deployment).
    Value: !GetAtt Service.ServiceArn
  BucketName:
    Description: Bucket com o estado compartilhado.
    Value: !Ref BucketName
  ErrorAlarmTopicArn:
    Description: Topico SNS do alarme de respostas 5xx.
    Value: !Ref ErrorAlarmTopic

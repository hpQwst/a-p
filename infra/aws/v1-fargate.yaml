AWSTemplateFormatVersion: "2010-09-09"
Description: QWST Auto PPT v1 - HTTPS web service with on-demand ECS Fargate workers.

Parameters:
  AppName:
    Type: String
    Default: squad5-nat-auto-ppt
    AllowedPattern: "[a-z][a-z0-9-]{2,31}"
  NameTagValue:
    Type: String
    Default: squad5-nat
    AllowedPattern: "[a-z0-9-]{3,32}"
  ImageUri:
    Type: String
    Description: Immutable ECR image URI, preferably using a sha256 digest.
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets. Public IP avoids a NAT Gateway in this low-cost v1.
  CertificateArn:
    Type: String
    Description: ACM certificate ARN in the same region as the ALB.
  AllowedCidr:
    Type: String
    Description: Corporate/VPN CIDR allowed to access the ALB. Do not use 0.0.0.0/0 before adding authentication.
    AllowedPattern: "(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}"
  OpenAISecretArn:
    Type: String
    Default: ""
  OpenAISecretJsonKey:
    Type: String
    Default: ""
  ExistingBucketName:
    Type: String
    Default: ""
    Description: Existing private S3 bucket. Leave blank to create one in this stack.
  OpenAIModel:
    Type: String
    Default: gpt-5.5
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues: [1]
    Description: V1 keeps one server-rendered web task; heavy preview and generation run in separate on-demand tasks.
  WebCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]
  WebMemory:
    Type: String
    Default: "2048"
    AllowedValues: ["512", "1024", "2048", "3072", "4096", "5120", "6144", "8192"]
  WorkerCpu:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048"]
  WorkerMemory:
    Type: String
    Default: "3072"
    AllowedValues: ["2048", "3072", "4096", "5120", "6144", "8192"]
  EphemeralStorageGiB:
    Type: Number
    Default: 40
    MinValue: 21
    MaxValue: 200
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]

Conditions:
  CreateStorageBucket: !Equals [!Ref ExistingBucketName, ""]
  HasOpenAISecret: !Not [!Equals [!Ref OpenAISecretArn, ""]]
  HasOpenAISecretJsonKey: !Not [!Equals [!Ref OpenAISecretJsonKey, ""]]

Resources:
  StorageBucket:
    Type: AWS::S3::Bucket
    Condition: CreateStorageBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AppName}
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AppName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-ecs-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - !If
          - HasOpenAISecret
          - PolicyName: read-openai-secret
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref OpenAISecretArn
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AppName}-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-storage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${BucketName}
                  - BucketName: !If [CreateStorageBucket, !Ref StorageBucket, !Ref ExistingBucketName]
                Condition:
                  StringLike:
                    s3:prefix: ["auto-ppt/*"]
        - PolicyName: launch-worker-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${AppName}-worker:*
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppName}-task
                Condition:
                  StringLike:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${BucketName}/auto-ppt/*
                  - BucketName: !If [CreateStorageBucket, !Ref StorageBucket, !Ref ExistingBucketName]
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub HTTPS access to ${AppName}
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Only the ${AppName} ALB can reach the task
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${AppName}-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AppName}-tg
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8501
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "60"
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AppName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref WebCpu
      Memory: !Ref WebMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      EphemeralStorage:
        SizeInGiB: !Ref EphemeralStorageGiB
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8501
              Protocol: tcp
          Environment:
            - Name: AUTO_PPT_STORAGE_BACKEND
              Value: s3
            - Name: AUTO_PPT_S3_BUCKET
              Value: !If [CreateStorageBucket, !Ref StorageBucket, !Ref ExistingBucketName]
            - Name: AUTO_PPT_S3_PREFIX
              Value: auto-ppt
            - Name: AUTO_PPT_RUNTIME_ROOT
              Value: /tmp/auto-ppt-jobs
            - Name: AUTO_PPT_EXECUTION_BACKEND
              Value: fargate
            - Name: AUTO_PPT_ECS_CLUSTER
              Value: !Ref Cluster
            - Name: AUTO_PPT_ECS_WORKER_TASK_DEFINITION
              Value: !Ref WorkerTaskDefinition
            - Name: AUTO_PPT_ECS_SUBNETS
              Value: !Join [",", !Ref PublicSubnetIds]
            - Name: AUTO_PPT_ECS_SECURITY_GROUPS
              Value: !Ref TaskSecurityGroup
            - Name: AUTO_PPT_PREVIEW_WORKERS
              Value: "1"
            - Name: AUTO_PPT_AI_AUTO_SOURCE_REVIEW
              Value: "0"
            - Name: AUTO_PPT_SLIDE_AI_MAX_SLIDES_PER_RUN
              Value: "1"
            - Name: AUTO_PPT_MAX_UPLOAD_MB
              Value: "250"
            - Name: AUTO_PPT_MAX_REQUEST_MB
              Value: "600"
            - Name: OPENAI_MODEL
              Value: !Ref OpenAIModel
          Secrets: !If
            - HasOpenAISecret
            - - Name: OPENAI_API_KEY
                ValueFrom: !If
                  - HasOpenAISecretJsonKey
                  - !Sub "${OpenAISecretArn}:${OpenAISecretJsonKey}::"
                  - !Ref OpenAISecretArn
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health/live', timeout=3)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90
          StopTimeout: 120
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AppName}-worker
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      EphemeralStorage:
        SizeInGiB: !Ref EphemeralStorageGiB
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Essential: true
          Environment:
            - Name: AUTO_PPT_STORAGE_BACKEND
              Value: s3
            - Name: AUTO_PPT_S3_BUCKET
              Value: !If [CreateStorageBucket, !Ref StorageBucket, !Ref ExistingBucketName]
            - Name: AUTO_PPT_S3_PREFIX
              Value: auto-ppt
            - Name: AUTO_PPT_RUNTIME_ROOT
              Value: /tmp/auto-ppt-jobs
            - Name: AUTO_PPT_EXECUTION_BACKEND
              Value: fargate
            - Name: AUTO_PPT_AI_AUTO_SOURCE_REVIEW
              Value: "0"
            - Name: AUTO_PPT_SLIDE_AI_MAX_SLIDES_PER_RUN
              Value: "1"
            - Name: OPENAI_MODEL
              Value: !Ref OpenAIModel
          Secrets: !If
            - HasOpenAISecret
            - - Name: OPENAI_API_KEY
                ValueFrom: !If
                  - HasOpenAISecretJsonKey
                  - !Sub "${OpenAISecretArn}:${OpenAISecretJsonKey}::"
                  - !Ref OpenAISecretArn
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
          StopTimeout: 120
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: !Sub ${AppName}-service
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: false
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 8501
          TargetGroupArn: !Ref TargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref PublicSubnetIds
      PropagateTags: SERVICE
      Tags:
        - Key: Name
          Value: !Ref NameTagValue
        - Key: App
          Value: !Ref AppName

Outputs:
  ApplicationUrl:
    Value: !Sub https://${LoadBalancer.DNSName}
  StorageBucketName:
    Value: !If [CreateStorageBucket, !Ref StorageBucket, !Ref ExistingBucketName]
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  WorkerTaskDefinitionArn:
    Value: !Ref WorkerTaskDefinition
